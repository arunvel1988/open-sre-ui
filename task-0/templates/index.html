<!DOCTYPE html>
<html>
<head>

    <title>AI-SRE Assistant</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 25px;
            border-bottom: 1px solid #30363d;
            background: #161b22;
        }

        .header h2 {
            margin: 0;
        }

        .header span {
            color: #8b949e;
            font-size: 13px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 850px;
            margin-bottom: 20px;
            padding: 15px 18px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            margin-left: auto;
            background: #1f6feb;
        }

        .assistant {
            margin-right: auto;
            background: #161b22;
            border: 1px solid #30363d;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #30363d;
            background: #161b22;
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 6px;
            outline: none;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #238636;
            color: white;
        }

        button:hover {
            background: #2ea043;
        }

        .clear {
            background: #30363d;
        }

    </style>

</head>

<body>

<div class="header">

    <h2>AI-SRE Assistant</h2>

    <span>
        LangGraph + Qwen3 + Ollama
    </span>

</div>


<div id="chat">

    <div class="message assistant">
        Hello. I'm your AI-SRE assistant.
        Ask me anything about your environment.
    </div>

</div>


<div class="input-area">

    <input
        id="message"
        placeholder="Ask the AI-SRE agent..."
        autocomplete="off"
    >

    <button onclick="sendMessage()">
        Send
    </button>

    <button
        class="clear"
        onclick="clearChat()">
        Clear
    </button>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("message");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    input.value = "";

    addMessage("Thinking...", "assistant");

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        const chat = document.getElementById("chat");

        chat.lastElementChild.remove();

        addMessage(
            data.response || data.error,
            "assistant"
        );

    } catch (error) {

        const chat = document.getElementById("chat");

        chat.lastElementChild.remove();

        addMessage(
            "Error connecting to AI agent: " + error,
            "assistant"
        );

    }

}


function addMessage(text, type) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

}


async function clearChat() {

    await fetch("/clear", {
        method: "POST"
    });

    document.getElementById("chat").innerHTML = "";

}

document
    .getElementById("message")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    });

</script>

</body>
</html>
